<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Cari Angka</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="setup-screen">
        <h1>Pilih Warna Kamu</h1>
        <div class="color-buttons">
            <button id="btn-red" onclick="pick('red')">MERAH</button>
            <button id="btn-blue" onclick="pick('blue')">BIRU</button>
        </div>
        <p id="setup-msg">Menunggu pemain lain memilih...</p>
    </div>

    <div id="game-screen" style="display: none;">
        <div id="info-header">Siap?</div>
        <button id="btn-reset" onclick="resetGame()">RESET / MAIN LAGI</button>
        
        <div id="game-board"></div>

        <div id="controls">
            <div class="player-info">
                <div class="label">SAYA: <span id="my-color-text">-</span></div>
                <div class="score"><span id="my-score">0</span>/144</div>
            </div>
            <button id="btn-action" disabled>TULIS (1s)</button>
            <div class="player-info">
                <div class="label">LAWAN</div>
                <div class="score"><span id="opp-score">0</span>/144</div>
            </div>
        </div>

        <div id="grid-container">
            <div id="my-grid" class="grid"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
